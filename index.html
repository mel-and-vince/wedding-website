                font-weight: 100;
                line-height: .5;
                margin-top: 25px;
                margin-bottom: 10px;">
        Oct 16, 2027
      </h1>

    <div class="container">
      <!-- Display the countdown timer in an element -->
      <p id="demo"></p>
      <style>
        #demo {
                font-size: clamp(.5rem, 3.75vw, 1rem);
          font-family: 'Fine Allie';
          font-weight: 100;
          margin-top: 25px;
          line-height: .5;
        }
      </style>

      <script>
      // Set the date we're counting down to
      var countDownDate = new Date("Oct 16, 2027 15:00:00").getTime();

      // Update the count down every 1 second
      var x = setInterval(function() {

        // Get today's date and time
        var now = new Date().getTime();

        // Find the distance between now and the count down date
        var distance = countDownDate - now;

        // Time calculations for years, months, weeks, days, hours, minutes and seconds
        var years = Math.floor(distance / (1000 * 60 * 60 * 24 * 365));
        var days = Math.floor(distance / (1000 * 60 * 60 * 24) - (365 * years));
        var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((distance % (1000 * 60)) / 1000);

        // Display the result in the element with id="demo"
        if (years > 0) {
          document.getElementById("demo").innerHTML =
            years + " year "
            + days + " days "
            + hours + " hours "
            + minutes + " minutes "
            + seconds + " seconds ";
        } else {
          document.getElementById("demo").innerHTML =
              days + " days "
              + hours + " hours "
              + minutes + " minutes "
              + seconds + " seconds ";
        }
        // If the count down is finished, write some text
        if (distance < 0) {
          clearInterval(x);
          document.getElementById("demo").innerHTML = "It's Showtime!";
        }
      }, 1000);
      </script>
    </div>
  </footer>
